spring.application.name=AuthenticationService
server.port=8082

# ===== MySQL (required via env vars; no secrets committed) =====
# Local dev uses the `demo` profile (H2) instead - see application-demo.properties.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/reglogin?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# ===== JWT =====
# Base64-encoded 256-bit HS256 secret. MUST be set in production via the
# JWT_SECRET environment variable (Render). Never commit the real value.
jwt.secret=${JWT_SECRET:}
# JWT lifetime: creation_time / expiry_time (minutes) used both for the token and the cookie.
jwt.expiry.minutes=30
jwt.issuer=reglogin-auth-service
jwt.cookie.name=accessToken
# Production (cross-origin Vercel -> Render) requires SameSite=None + Secure=true over HTTPS.
jwt.cookie.secure=${JWT_COOKIE_SECURE:false}
jwt.cookie.same-site=${JWT_COOKIE_SAME_SITE:Lax}

# ===== CORS =====
# Only allowed origins may call this service (frontend + local dev).
# Override in production with CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173,http://localhost:3000}

# ===== Logging =====
logging.level.com.reglogin.auth=INFO