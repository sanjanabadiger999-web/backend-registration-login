# Render Blueprint for the AUTH service (login / JWT cookie).
# Service URL after deploy: https://reglogin-auth-service.onrender.com
# Endpoints: POST /api/login, GET /api/me, POST /api/logout   Health: GET /health
#
# NOTE: Render only auto-detects a blueprint at the repository ROOT.
# If you keep this file in a subfolder, create the service from the Render
# dashboard instead (New -> Web Service -> repo -> Root Directory = AuthenticationService)
# and apply the env vars listed below.
#
# Production cookie flags (cross-origin Vercel -> Render):
#   JWT_COOKIE_SECURE=true, JWT_COOKIE_SAME_SITE=None  (requires HTTPS - Render provides it)

services:
  - type: web
    name: reglogin-auth-service
    runtime: docker
    plan: free
    rootDir: .
    healthCheckPath: /health
    envVars:
      - key: DB_URL
        value: jdbc:mysql://your-mysql-host:3306/reglogin?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - key: DB_USERNAME
        value: reglogin
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_COOKIE_SECURE
        value: "true"
      - key: JWT_COOKIE_SAME_SITE
        value: "None"
      - key: CORS_ALLOWED_ORIGINS
        value: https://reglogin-frontend.vercel.app,http://localhost:5173,http://localhost:3000