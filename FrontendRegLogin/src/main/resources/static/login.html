<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | reglogin</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="card">
        <div class="brand">
            <div class="logo">R</div>
            <h1>Welcome back</h1>
            <p>Log in to your account</p>
        </div>

        <div id="alertBox" class="alert" role="alert"></div>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="name">User Name</label>
                <input type="text" id="name" name="name" autocomplete="username" placeholder="Enter your username">
                <span class="error-text" id="nameError"></span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter your password">
                <span class="error-text" id="passwordError"></span>
            </div>

            <button type="submit" id="loginBtn" class="btn">Login</button>
        </form>

        <p class="links"><a href="signup.html">New user? Sign Up</a></p>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
