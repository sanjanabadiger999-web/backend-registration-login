# Render Blueprint for the SINGLE reglogin backend service.
# Service URL after deploy: https://reglogin-user-service.onrender.com
# Endpoints: POST /api/reg, POST /api/login, GET /api/me, POST /api/logout
# Health check: GET /health
#
# NOTE: Render only auto-detects a blueprint at the repository ROOT.
# If you keep this file in a subfolder, create the service from the Render
# dashboard instead (New -> Web Service -> repo -> Root Directory = UserService)
# and apply the env vars listed below.
#
# Required env vars to set in the Render dashboard (sync: false =>
# not stored in this repo): DB_URL, DB_PASSWORD, JWT_SECRET, FRONTEND_URL.

services:
  - type: web
    name: reglogin-user-service
    runtime: docker
    plan: free
    rootDir: .
    healthCheckPath: /health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false