# ============================================================================
# DEMO PROFILE - LOCAL DEVELOPMENT ONLY. Uses a shared file-based H2 database
# (no MySQL, no Aiven). Activate with:  --spring.profiles.active=demo
# Production uses application-prod.properties (Aiven MySQL via env vars).
# ============================================================================
server.port=8080

spring.datasource.url=jdbc:h2:file:C:/Users/SANJAN~1/AppData/Local/Temp/opencode/reglogin/reglogin;AUTO_SERVER=TRUE;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

bcrypt.strength=10

# ===== JWT (local demo) =====
# Dev-only fallback so this profile runs without a JWT_SECRET env var.
# Used literally as UTF-8 bytes (>= 32 chars/bits requirement) - NOT Base64.
# Production MUST set JWT_SECRET (application-prod.properties has no fallback).
jwt.secret=${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
jwt.expiry.minutes=30
jwt.issuer=reglogin-auth-service
jwt.cookie.name=accessToken

# Local HTTP (same-origin) cookie flags: HttpOnly, no Secure, SameSite=Lax.
jwt.cookie.secure=false
jwt.cookie.same-site=Lax