spring.application.name=UserService
server.port=8081

# ===== MySQL (required via env vars; no secrets committed) =====
# Local dev uses the `demo` profile (H2) instead - see application-demo.properties.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/reglogin?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Quoting keeps the reserved MySQL keyword `user` safe as the table name.
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# ===== BCrypt =====
bcrypt.strength=10

# ===== CORS =====
# Comma-separated origins allowed to call this service. Override in production
# with CORS_ALLOWED_ORIGINS (Vercel frontend + local dev origins).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173,http://localhost:3000}

# ===== Logging =====
logging.level.com.reglogin.user=INFO