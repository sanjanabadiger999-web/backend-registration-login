spring.application.name=UserService

# Local default: http://localhost:8080. Render injects PORT for production.
server.port=${PORT:8080}

# ===== Driver =====
# Driver is derived from the datasource URL (demo/profile restrict it).
# Production pins spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver.

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Quoting keeps the reserved MySQL keyword `user` safe as the table name.
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# ===== BCrypt =====
bcrypt.strength=10

# ===== CORS =====
# FRONTEND_URL (single, e.g. Vercel) or CORS_ALLOWED_ORIGINS (comma list).
# Never "*" because cookies/credentials are used.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:5173,http://localhost:8080,http://localhost:3000}}

# ===== Logging =====
logging.level.com.reglogin=INFO

# ===== Security =====
# No generated default in-memory user: authentication is JWT-based only.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ===== Profiles =====
# local dev (H2): --spring.profiles.active=demo
# production (Aiven MySQL): --spring.profiles.active=prod
# + env: DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET (prod)
#        PORT, FRONTEND_URL / CORS_ALLOWED_ORIGINS