# ============================================================================
# PRODUCTION PROFILE - Aiven MySQL. Activate with --spring.profiles.active=prod
# All values come from the environment. No secrets are hardcoded here.
#   DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET  (required - app fails fast)
#   PORT (Render injects it; default 8080)
#   FRONTEND_URL (Vercel origin) or CORS_ALLOWED_ORIGINS (comma list)
#
# Example Aiven JDBC URL (host only - no password):
#   DB_URL=jdbc:mysql://<HOST>:<PORT>/<DBNAME>?ssl-mode=REQUIRED
# ============================================================================
server.port=${PORT:8080}

# Use the full JDBC URL (DB_URL) OR per-field vars (DB_HOST/DB_PORT/DB_NAME/DB_SSL,
# see AivenJdbcEnvironmentPostProcessor). Aiven requires TLS: ssl-mode=REQUIRED.
# All three are required; prod never falls back to an embedded/H2 datasource.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Keep the pool small: Aiven free plans have a low max_connections.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=15000

logging.level.com.reglogin=INFO

# ===== JWT (production) =====
# Required - the app refuses to start without JWT_SECRET (raw UTF-8 string,
# at least 32 bytes for HS256). Used directly as UTF-8 bytes - NOT Base64.
jwt.secret=${JWT_SECRET}
jwt.expiry.minutes=${JWT_EXPIRY_MINUTES:30}
jwt.issuer=reglogin-auth-service
jwt.cookie.name=accessToken

# Cross-origin (Vercel frontend -> Render backend) over HTTPS:
#   Secure + SameSite=None lets the browser store/send the HttpOnly cookie.
jwt.cookie.secure=true
jwt.cookie.same-site=None