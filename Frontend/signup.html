<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | reglogin</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="card">
        <div class="brand">
            <div class="logo">R</div>
            <h1>Create your account</h1>
            <p>Sign up to get started</p>
        </div>

        <div id="alertBox" class="alert" role="alert"></div>

        <form id="signupForm" novalidate>
            <div class="form-group">
                <label for="name">User Name</label>
                <input type="text" id="name" name="name" autocomplete="username" placeholder="e.g. jane_doe">
                <span class="error-text" id="nameError"></span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="new-password" placeholder="At least 6 characters">
                <span class="error-text" id="passwordError"></span>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" placeholder="Re-enter password">
                <span class="error-text" id="confirmPasswordError"></span>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com">
                <span class="error-text" id="emailError"></span>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="e.g. 9876543210">
                <span class="error-text" id="phoneError"></span>
            </div>

            <button type="submit" id="signupBtn" class="btn">Sign Up</button>
        </form>

        <p class="links">Already have an account? <a href="login.html">Login</a></p>
    </main>

    <script type="module" src="js/signup.js"></script>
</body>
</html>
